
services:
  postgres:
    image: postgres:17
    container_name: routeback-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: routeback
      POSTGRES_USER: routeback_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your .env file}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - routeback_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U routeback_user -d routeback"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  routeback_data: